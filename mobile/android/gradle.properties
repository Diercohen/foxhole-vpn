org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
# the ABIs nodejs-mobile builds Node for (no 32-bit x86); one APK each
reactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true
# AGP 9's built-in Kotlin and new DSL: not yet with React Native
android.builtInKotlin=false
android.newDsl=false
